name: PHP CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
    
    - name: Check syntax
      run: |
        find ./src -name "*.php" -exec php -l {} \;
        find ./tests -name "*.php" -exec php -l {} \;
    
    - name: Run tests
      run: |
        php tests/AnalysisControllerTest.php
